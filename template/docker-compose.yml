version: '3.3'

networks:
  default_net:
    driver: bridge

services:
  # === 服务1: SSH 隧道 (负责打洞) ===
  tunnel:
    image: alpine:latest
    container_name: tunnel_${PROJECT_NAME}
    networks:
      - default_net
    restart: always
    environment:
      SSH_HOST: ${SSH_HOST}
      SSH_PORT: ${SSH_PORT}
      SSH_USER: ${SSH_USER}
      SSH_PASSWORD: ${SSH_PASSWORD}
      REMOTE_DB_PORT: ${REMOTE_DB_PORT}
    volumes:
      - ./ssh-keys:/root/.ssh:ro
    command: >
      sh -c "
      apk add --no-cache openssh-client sshpass netcat-openbsd &&
      if [ -s /root/.ssh/id_rsa ]; then
        echo '>>> Using SSH Key...'
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -N -L 0.0.0.0:3306:127.0.0.1:${REMOTE_DB_PORT} -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST}
      else
        echo '>>> Using SSH Password...'
        if [ -z '${SSH_PASSWORD}' ]; then echo 'Error: No SSH_PASSWORD'; exit 1; fi
        sshpass -p '${SSH_PASSWORD}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -N -L 0.0.0.0:3306:127.0.0.1:${REMOTE_DB_PORT} -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST}
      fi
      "
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3306 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # === 服务2: 数据库 (通过隧道连接) ===
  db:
    image: mysql:8.0
    container_name: db_${PROJECT_NAME}
    networks:
      - default_net
    restart: always
    depends_on:
      tunnel:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKUP_MYSQL_EXPORT_POINT}:3306"
    command: |
      bash -c '
      if [ ! -f /var/run/sync.lock ]; then
        nohup bash /scripts/init-slave.sh > /var/log/slave_monitor.log 2>&1 &
      fi
      exec docker-entrypoint.sh mysqld \
        --default-authentication-plugin=mysql_native_password \
        --character-set-server=utf8mb4 \
        --collation-server=utf8mb4_unicode_ci \
        --server-id=100 \
        --log-bin=mysql-bin \
        --binlog-format=ROW \
        --gtid-mode=ON \
        --enforce-gtid-consistency=ON \
        --read-only=1 \
        --log-slave-updates=ON \
        --replicate-do-db=${TARGET_DB_NAME} \
        --relay-log-recovery=1 \
        --max_connections=200 \
        --innodb_buffer_pool_size=512M
      '
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MASTER_HOST: tunnel
      MASTER_PORT: 3306
      MASTER_USER: ${MASTER_USER}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      TARGET_DB_NAME: ${TARGET_DB_NAME}
    volumes:
      - ./dump-cache:/var/lib/mysql-sync
      - ./data:/var/lib/mysql
      - ./init-slave.sh:/scripts/init-slave.sh:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # === 服务3: phpMyAdmin (可视化管理) ===
  pma:
    image: phpmyadmin/phpmyadmin
    container_name: pma_${PROJECT_NAME}
    networks:
      - default_net
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PMA_WEB_PORT}:80"
    depends_on:
      db:
        condition: service_healthy
