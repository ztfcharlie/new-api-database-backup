networks:
  default_net:
    driver: bridge

services:
  # === 服务1: SSH 隧道 (负责打洞) ===
  tunnel:
    image: alpine:latest
    container_name: tunnel_${PROJECT_NAME}
    networks:
      - default_net
    restart: always
    environment:
      SSH_HOST: ${SSH_HOST}
      SSH_PORT: ${SSH_PORT}
      SSH_USER: ${SSH_USER}
      SSH_PASSWORD: ${SSH_PASSWORD}
      REMOTE_DB_PORT: ${REMOTE_DB_PORT}
    volumes:
      - ./ssh-keys:/root/.ssh:ro
    command: >
      sh -c "
      apk add --no-cache openssh-client sshpass netcat-openbsd &&
      if [ -s /root/.ssh/id_rsa ]; then
        echo '>>> Using SSH Key...'
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -N -L 0.0.0.0:5432:127.0.0.1:${REMOTE_DB_PORT} -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST}
      else
        echo '>>> Using SSH Password...'
        if [ -z '${SSH_PASSWORD}' ]; then echo 'Error: No SSH_PASSWORD'; exit 1; fi
        sshpass -p '${SSH_PASSWORD}' ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o ExitOnForwardFailure=yes -N -L 0.0.0.0:5432:127.0.0.1:${REMOTE_DB_PORT} -p ${SSH_PORT} ${SSH_USER}@${SSH_HOST}
      fi
      "
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5432 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # === 服务2: PostgreSQL 备库 (通过隧道连接主库) ===
  db:
    image: postgres:15
    container_name: db_${PROJECT_NAME}
    networks:
      - default_net
    restart: always
    depends_on:
      tunnel:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKUP_PG_EXPORT_POINT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPL_USER: ${REPL_USER}
      REPL_PASSWORD: ${REPL_PASSWORD}
      MASTER_USER: ${MASTER_USER}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      PRIMARY_HOST: tunnel
      PRIMARY_PORT: 5432
      REUSE_BASEBACKUP: ${REUSE_BASEBACKUP}

    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./dump-cache:/var/lib/postgresql/basebackup-cache
      - ./entrypoint.sh:/scripts/entrypoint.sh:ro
      - ./init-slave.sh:/scripts/init-slave.sh:ro
    # >>> 关键：用自定义 entrypoint 替代官方 entrypoint
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
  # === 服务3: pgAdmin (可视化管理) ===
  pma:
    image: dpage/pgadmin4:latest
    container_name: pma_${PROJECT_NAME}
    networks:
      - default_net
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@burncloud.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "127.0.0.1:${PMA_WEB_PORT}:80"
    depends_on:
      db:
        condition: service_healthy

